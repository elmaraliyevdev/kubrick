# Kubrick — nginx config for app.kubrick.app + api.kubrick.app + public career subdomains
# Copy to /etc/nginx/sites-available/kubrick and symlink to sites-enabled
# Then run: sudo certbot --nginx -d kubrick.app -d app.kubrick.app -d api.kubrick.app
# For {org}.kubrick.app career pages, issue a wildcard cert with a DNS challenge:
# sudo certbot certonly --manual --preferred-challenges dns -d "*.kubrick.app" -d kubrick.app

# Redirect root domain to app subdomain
server {
    listen 80;
    server_name kubrick.app;
    return 301 https://app.kubrick.app$request_uri;
}

# Frontend — app.kubrick.app and {org}.kubrick.app career pages (static files from Vite build)
server {
    listen 80;
    server_name app.kubrick.app *.kubrick.app;

    root /home/kubrick/kubrick/frontend/dist;
    index index.html;

    # Vite hashed assets — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Backend — api.kubrick.app (reverse proxy to uvicorn)
server {
    listen 80;
    server_name api.kubrick.app;

    client_max_body_size 50m;

    # Serve uploaded files directly (logos, resumes) — bypass Python
    location /uploads/ {
        alias /home/kubrick/kubrick/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy everything else to uvicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed later)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
